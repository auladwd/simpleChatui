# ============================================================
# CD Pipeline – Frontend PROD (AUTO-TRIGGERED on PR)
#
# Trigger  : pull_request opened/reopened/synchronised against prod
#            → NO separate manual action required
# Branch   : prod
# Actions  : build Dockerfile.prod → tag → push → update gitops
#            (Argo CD then auto-syncs prod Application)
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME  – Docker Hub login
#   DOCKERHUB_TOKEN     – Docker Hub access token
#   GITOPS_TOKEN        – GitHub PAT with write access to gitops repo
# ============================================================

name: CD – Frontend PROD (Auto on PR)

on:
  pull_request:
    branches: [prod]
    types: [opened, reopened, synchronize]

concurrency:
  group: cd-frontend-prod-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Build & Auto-Deploy to PROD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          # Checkout the head of the PR (the incoming branch)
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute image tag
        id: tag
        run: |
          SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          TS=$(date -u +"%Y%m%dT%H%M%SZ")
          TAG="prod-${SHA}-${TS}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/support-chat-frontend:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PROD image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
          build-args: |
            VITE_API_URL=http://backend-service.prod.svc.cluster.local:5000
            VITE_SOCKET_URL=http://backend-service.prod.svc.cluster.local:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: mdarifahammedreza/support-chat-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update frontend image tag in prod manifests
        run: |
          cd gitops
          sed -i "s|image: auladdevops/support-chat-frontend:.*|image: ${{ steps.tag.outputs.image }}|g" \
            k8s/prod/frontend-deployment.yaml

      - name: Commit and push GitOps change
        run: |
          cd gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/prod/frontend-deployment.yaml
          git commit -m "chore(prod): bump frontend to ${{ steps.tag.outputs.tag }}

          PR: #${{ github.event.pull_request.number }} – ${{ github.event.pull_request.title }}
          Triggered by: ${{ github.actor }}
          Source commit: ${{ github.event.pull_request.head.sha }}"
          git push

      - name: Summarise deployment
        run: |
          echo "### ✅ Production Deployment Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.tag.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PR | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.event.pull_request.head.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | Auto-sync will reconcile prod namespace |" >> $GITHUB_STEP_SUMMARY
